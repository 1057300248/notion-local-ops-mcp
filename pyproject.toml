[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-local-ops-mcp"
version = "0.1.0"
description = "Local FastMCP server for Notion daily ops with delegate_task fallback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Keep this explicit: local launchd/dev scripts verify the live venv
    # against pyproject.toml so stale editable metadata cannot silently drift.
    "fastmcp>=3.2.4,<4",
    "uvicorn>=0.30.0",
    # Direct imports in chrome.py / webtools.py (also a fastmcp transitive dep).
    "httpx>=0.27.0",
    # read_image / screenshot / chrome_screenshot compression.
    "pillow>=10.0.0",
    # CDP websocket client used by the chrome_* tools.
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
notion-local-ops-mcp = "notion_local_ops_mcp.server:main"
notion-local-ops-supervisor = "notion_local_ops_mcp.supervisor:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
